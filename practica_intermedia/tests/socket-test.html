<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BildyApp — Test Socket.IO</title>
  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    h1 { color: #e94560; }
    input { padding: 8px; width: 400px; background: #16213e; color: white; border: 1px solid #444; border-radius: 4px; }
    button { padding: 8px 16px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 8px; }
    #log { margin-top: 20px; background: #0d1117; padding: 16px; border-radius: 8px; min-height: 200px; }
    .event { padding: 6px; border-bottom: 1px solid #222; }
    .event.green { color: #3fb950; }
    .event.blue { color: #58a6ff; }
    .event.yellow { color: #f0c040; }
    .event.red { color: #e94560; }
  </style>
</head>
<body>
  <h1>🔌 BildyApp — Test Socket.IO</h1>

  <div>
    <input type="text" id="tokenInput" placeholder="Pega aquí tu accessToken..." />
    <button onclick="connect()">Conectar</button>
    <button onclick="disconnect()" style="background:#555;">Desconectar</button>
  </div>

  <div id="status" style="margin-top:12px; color:#888;">Estado: desconectado</div>

  <div id="log"></div>

  <script>
    let socket;

    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `event ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      document.getElementById('log').prepend(div);
    }

    function connect() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Pega tu token primero');

      if (socket) socket.disconnect();

      socket = io('http://localhost:3000', { auth: { token } });

      socket.on('connect', () => {
        document.getElementById('status').textContent = '🟢 Estado: conectado (' + socket.id + ')';
        document.getElementById('status').style.color = '#3fb950';
        log('Conectado al servidor', 'green');
      });

      socket.on('connect_error', (err) => {
        document.getElementById('status').textContent = '🔴 Estado: error — ' + err.message;
        document.getElementById('status').style.color = '#e94560';
        log('Error de conexión: ' + err.message, 'red');
      });

      socket.on('disconnect', () => {
        document.getElementById('status').textContent = '⚫ Estado: desconectado';
        document.getElementById('status').style.color = '#888';
        log('Desconectado', 'red');
      });

      // Eventos de negocio
      socket.on('client:new', (data) => {
        log('🏢 client:new — ' + JSON.stringify(data.client?.name), 'blue');
      });

      socket.on('project:new', (data) => {
        log('📁 project:new — ' + JSON.stringify(data.project?.name), 'yellow');
      });

      socket.on('deliverynote:new', (data) => {
        log('📄 deliverynote:new — formato: ' + data.deliveryNote?.format, 'blue');
      });

      socket.on('deliverynote:signed', (data) => {
        log('✍️ deliverynote:signed — ID: ' + data.deliveryNoteId, 'green');
      });
    }

    function disconnect() {
      if (socket) socket.disconnect();
    }
  </script>
</body>
</html>
